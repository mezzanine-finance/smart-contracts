name: security

on:
  pull_request:
    branches: [main, develop]

jobs:
  aderyn-and-slither:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run Aderyn
        run: |
          npx aderyn \
            --output reports/aderyn.md

      - name: Fail if Aderyn found Medium+ issues
        run: |
          REPORT="reports/aderyn.md"

          if [ ! -f "$REPORT" ]; then
            echo "Aderyn report not found at $REPORT"
            exit 1
          fi

          if grep -qE '^## (High|Medium) Issues' "$REPORT"; then
            echo "Aderyn found High/Medium issues. Failing CI."
            exit 1
          else
            echo "Aderyn: no Medium+ issues ✅"
          fi

      - name: Upload Aderyn report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aderyn-report
          path: reports/aderyn.md

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither
        run: npm run slither