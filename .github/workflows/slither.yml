name: slither

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      fail_on:
        description: "Fail the workflow if Slither finds issues of this severity or higher (manual runs only override)"
        required: false
        default: "high"
        type: choice
        options:
          - none
          - high
          - medium
          - low
          - all

jobs:
  slither:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run Slither (SARIF)
        uses: crytic/slither-action@v0.4.1
        id: slither
        with:
          ignore-compile: true
          sarif: reports/slither/results.sarif
          # PRs: fail on HIGH+. Manual runs: allow overriding via input.
          fail-on: ${{ github.event_name == 'pull_request' && 'high' || (github.event.inputs.fail_on || 'high') }}
          slither-args: "--exclude-informational --exclude-low"

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}

      - name: Upload Slither report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: reports/slither/
          if-no-files-found: error
