name: slither

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  slither:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run Slither
        uses: crytic/slither-action@v0.4.1
        id: slither
        with:
          ignore-compile: true
          fail-on: high
