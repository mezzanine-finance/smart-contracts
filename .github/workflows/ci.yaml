name: ci

on:
    pull_request:
    push:
        branches: [main, dev]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        env:
            FORKING_URL: ${{ secrets.FORKING_URL }}
            FORKING: "true"

            NODE_OPTIONS: --max_old_space_size=4096

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: Install deps
              run: npm ci

            - name: Compile
              run: npm run compile

            - name: Run tests
              run: npm run test

    cre-workflows:
        name: CRE workflow (${{ matrix.workflow }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                workflow:
                    - nav-workflow
                    - finalization-workflow
                    - nav-submitter-workflow

        defaults:
            run:
                working-directory: cre/${{ matrix.workflow }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Bun 1.3.10
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.10

            - name: Install workflow dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck workflow
              run: bun run typecheck

            - name: Test workflow
              run: bun test
