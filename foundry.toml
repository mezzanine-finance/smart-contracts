[profile.default]
src = "contracts"
test = "test/foundry/fuzz"
script = "script/foundry"
out = "out-foundry"
cache_path = "cache_forge"
libs = ["lib", "node_modules"]

solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.ci.fuzz]
runs = 1500
